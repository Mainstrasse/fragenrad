name: Weiterleitung zur neuen Adresse veröffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # Das Spiel liegt jetzt auf https://kg-fragenspiel.web.app – hier nur noch die Weiterleitung
      - name: Weiterleitung zusammenstellen
        run: |
          mkdir site
          cp redirect/index.html redirect/sw.js .nojekyll site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
